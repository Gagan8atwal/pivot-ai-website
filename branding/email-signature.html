<!--
  Pivot AI — HTML email signature.
  Usage: replace the {{...}} placeholders, then paste into Gmail/Outlook signature editor.
  Table-based + inline styles for maximum email-client compatibility. The logo uses an
  inline data-URI SVG (no external hosting). If a client strips SVG, host a PNG of the mark
  and swap the <img src>. Colours: Navy #0E1B2C, Amber #F59E0B.
-->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; color:#0E1B2C;">
  <tr>
    <td style="vertical-align:top; padding-right:18px; border-right:2px solid #F59E0B;">
      <img width="56" height="56" alt="Pivot AI"
        src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%230E1B2C'/%3E%3Cpath%20d='M41%2043c-2.2%200-4.4-.4-6.4-1.2-.6-.2-1.4-.2-1.8.4l-3.8%204.8c-5.6-2.8-10-7.2-12.8-12.8l4.8-3.8c.6-.6.6-1.2.4-1.8-.8-2-1.2-4.2-1.2-6.4%200-1.2-.8-2-2-2H13c-1.2%200-2%20.8-2%202%200%2016.6%2013.4%2030%2030%2030%201.2%200%202-.8%202-2v-5c0-1.2-.8-2-2-2z'%20fill='%23F59E0B'/%3E%3C/svg%3E" />
    </td>
    <td style="vertical-align:top; padding-left:18px;">
      <div style="font-size:16px; font-weight:bold; color:#0E1B2C;">{{Full Name}}</div>
      <div style="font-size:13px; font-weight:bold; color:#F59E0B; padding:2px 0 6px;">{{Title}} · Pivot AI</div>
      <div style="font-size:12px; color:#334155; line-height:1.6;">
        <a href="tel:{{+15550000000}}" style="color:#334155; text-decoration:none;">{{+1 (555) 000-0000}}</a><br/>
        <a href="mailto:{{name@pivotcalls.co}}" style="color:#334155; text-decoration:none;">{{name@pivotcalls.co}}</a><br/>
        <a href="https://pivotcalls.co" style="color:#0E1B2C; font-weight:bold; text-decoration:none;">pivotcalls.co</a>
      </div>
      <div style="font-size:11px; color:#64748B; padding-top:8px;">The 24/7 AI receptionist for local service businesses.</div>
    </td>
  </tr>
</table>
