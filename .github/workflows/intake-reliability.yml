name: Public Intake Reliability

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/contact/**'
      - 'app/api/demo/**'
      - 'app/contact/**'
      - 'app/demo/**'
      - 'lib/intake*.ts'
      - 'lib/google-calendar.ts'
      - 'scripts/intake.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/intake-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      DASHBOARD_OWNER_ID: 00000000-0000-4000-8000-000000000000
      OWNER_EMAIL: owner@example.com
      FROM_EMAIL: Pivot AI <hello@example.com>
      RESEND_API_KEY: re_test_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression suites
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
